name: EAS Build

on:
  push:
    branches: [master]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test Edge Functions
        run: npm run test:functions

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (production)
        run: eas build --platform android --profile production --non-interactive --no-wait

  build-ios:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Credentials (distribution cert + provisioning profile) are managed
      # remotely by EAS (`eas credentials -p ios`), not this workflow -- same
      # EXPO_TOKEN as the Android job is sufficient, no Apple secrets needed
      # here. Submission to App Store Connect is a separate, manual step
      # (`eas submit -p ios`) until an ASC API key is wired up.
      - name: Build iOS (production)
        run: eas build --platform ios --profile production --non-interactive --no-wait
